name: Build Android Inbox APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build Debug APK
        working-directory: android-inbox
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: gradle :app:assembleDebug -PADMIN_KEY="$ADMIN_KEY" --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-services-inbox-debug-apk
          path: android-inbox/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
