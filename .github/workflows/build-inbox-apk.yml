name: Build Inbox APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build APK
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          cd android-inbox
          gradle assembleDebug -PADMIN_KEY="$ADMIN_KEY" --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-services-inbox-debug
          path: android-inbox/app/build/outputs/apk/debug/*.apk
