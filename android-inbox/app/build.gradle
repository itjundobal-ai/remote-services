plugins {
    id 'com.android.application'
}

android {
    namespace 'com.itjundobal.remoteservices.inbox'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.itjundobal.remote.services.inbox'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'ADMIN_KEY', '"' + (project.findProperty('ADMIN_KEY') ?: '') + '"'
    }
}
